name: Release desktop

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.14.0'
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify "${RELEASE_TAG}"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

  macos:
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build desktop and workspace dependencies
        run: pnpm exec turbo run build --filter=@pulse-rn/desktop...
      - name: Package Apple Silicon and Intel DMGs
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_SIGNING_READY: ${{ secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          args=(--mac dmg zip --arm64 --x64 --publish never)
          if [[ "$MAC_SIGNING_READY" == "true" ]]; then
            args+=(-c.forceCodeSigning=true -c.extraMetadata.pulseRNAutoUpdate=true)
          else
            args+=(-c.mac.identity=null -c.mac.hardenedRuntime=false -c.mac.notarize=false)
          fi
          pnpm --filter @pulse-rn/desktop exec electron-builder "${args[@]}"
      - name: Verify Apple Silicon and Intel applications
        env:
          MAC_SIGNING_READY: ${{ secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          arm_framework="apps/desktop/release/mac-arm64/PulseRN.app/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework"
          intel_framework="apps/desktop/release/mac/PulseRN.app/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework"
          test "$(lipo -archs "$arm_framework")" = "arm64"
          test "$(lipo -archs "$intel_framework")" = "x86_64"
          test -f "apps/desktop/release/PulseRN-${RELEASE_TAG#v}-mac-arm64.dmg"
          test -f "apps/desktop/release/PulseRN-${RELEASE_TAG#v}-mac-x64.dmg"
          test -f "apps/desktop/release/PulseRN-${RELEASE_TAG#v}-mac-arm64.zip"
          test -f "apps/desktop/release/PulseRN-${RELEASE_TAG#v}-mac-x64.zip"
          test -f "apps/desktop/release/latest-mac.yml"
          if [[ "$MAC_SIGNING_READY" == "true" ]]; then
            for application in \
              "apps/desktop/release/mac-arm64/PulseRN.app" \
              "apps/desktop/release/mac/PulseRN.app"; do
              codesign --verify --deep --strict --verbose=2 "$application"
              spctl --assess --verbose --type exec "$application"
              xcrun stapler validate "$application"
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            apps/desktop/release/PulseRN-*-mac-arm64.dmg
            apps/desktop/release/PulseRN-*-mac-x64.dmg
            apps/desktop/release/PulseRN-*-mac-arm64.zip
            apps/desktop/release/PulseRN-*-mac-x64.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build desktop and workspace dependencies
        run: pnpm exec turbo run build --filter=@pulse-rn/desktop...
      - name: Package NSIS installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WINDOWS_SIGNING_READY: ${{ secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' }}
        run: |
          args=(--win nsis --${{ matrix.arch }} --publish never)
          if [[ "$WINDOWS_SIGNING_READY" == "true" ]]; then
            args+=(-c.forceCodeSigning=true)
            if [[ "${{ matrix.arch }}" == "x64" ]]; then
              args+=(-c.extraMetadata.pulseRNAutoUpdate=true)
            fi
          fi
          pnpm --filter @pulse-rn/desktop exec electron-builder "${args[@]}"
      - name: Verify Windows architecture and artifact
        shell: pwsh
        env:
          WINDOWS_SIGNING_READY: ${{ secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' }}
        run: |
          $exe = Get-ChildItem "apps/desktop/release" -Recurse -Filter "PulseRN.exe" |
            Where-Object { $_.DirectoryName -match "unpacked" } |
            Select-Object -First 1
          if (-not $exe) { throw "Packaged PulseRN.exe was not found." }
          node scripts/verify-pe-architecture.mjs $exe.FullName "${{ matrix.arch }}"
          $version = $env:RELEASE_TAG.Substring(1)
          $installer = "apps/desktop/release/PulseRN-$version-windows-${{ matrix.arch }}-setup.exe"
          if (-not (Test-Path $installer)) { throw "Missing $installer" }
          if ($env:WINDOWS_SIGNING_READY -eq "true") {
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature: $($signature.Status)"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ matrix.arch }}
          path: |
            apps/desktop/release/PulseRN-*-windows-${{ matrix.arch }}-setup.exe
            apps/desktop/release/PulseRN-*-windows-${{ matrix.arch }}-setup.exe.blockmap
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x64'
        with:
          name: desktop-windows-update-x64
          path: apps/desktop/release/latest.yml
          if-no-files-found: error

  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build desktop and workspace dependencies
        run: pnpm exec turbo run build --filter=@pulse-rn/desktop...
      - name: Package AppImage and Debian installer
        run: pnpm --filter @pulse-rn/desktop exec electron-builder --linux AppImage deb --x64 --publish never
      - name: Verify Linux artifacts
        run: |
          version="${RELEASE_TAG#v}"
          appimage="apps/desktop/release/PulseRN-${version}-linux-x64.AppImage"
          deb="apps/desktop/release/PulseRN-${version}-linux-x64.deb"
          test -x "$appimage"
          test -f "apps/desktop/release/latest-linux.yml"
          dpkg-deb --info "$deb"
          cd apps/desktop/release
          "./PulseRN-${version}-linux-x64.AppImage" --appimage-extract >/dev/null
          test -x squashfs-root/pulsern
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            apps/desktop/release/PulseRN-*-linux-x64.AppImage
            apps/desktop/release/PulseRN-*-linux-x64.deb
            apps/desktop/release/latest-linux.yml
          if-no-files-found: error

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Verify release set and create checksums
        run: |
          version="${RELEASE_TAG#v}"
          expected=(
            "PulseRN-${version}-mac-arm64.dmg"
            "PulseRN-${version}-mac-x64.dmg"
            "PulseRN-${version}-mac-arm64.zip"
            "PulseRN-${version}-mac-x64.zip"
            "PulseRN-${version}-windows-x64-setup.exe"
            "PulseRN-${version}-windows-arm64-setup.exe"
            "PulseRN-${version}-linux-x64.AppImage"
            "PulseRN-${version}-linux-x64.deb"
          )
          for artifact in "${expected[@]}"; do
            test -f "release/$artifact" || {
              echo "::error::Missing release/$artifact"
              exit 1
            }
          done
          for metadata in latest-mac.yml latest.yml latest-linux.yml; do
            test -f "release/$metadata" || {
              echo "::error::Missing release/$metadata"
              exit 1
            }
          done
          cd release
          sha256sum "${expected[@]}" > SHA256SUMS.txt
      - name: Generate SBOM and architecture report
        run: node scripts/generate-release-metadata.mjs release "${RELEASE_TAG#v}"
      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/PulseRN-*
            release/latest*.yml
            release/SHA256SUMS.txt
            release/SBOM.spdx.json
            release/ARCHITECTURES.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "PulseRN ${RELEASE_TAG#v}" \
            --generate-notes \
            "${prerelease[@]}"
