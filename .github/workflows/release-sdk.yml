name: Release SDK

on:
  push:
    tags:
      - 'sdk-v[0-9]+.[0-9]+.[0-9]+'
      - 'sdk-v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: SDK version to prepare and publish (for example 1.0.3)
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.14.0'

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.ref }}
          fetch-depth: 0

      - id: release
        name: Resolve or prepare SDK release tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${REQUESTED_VERSION#sdk-v}"
            version="${version#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Version must use the form X.Y.Z or X.Y.Z-prerelease."
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "release_tag=sdk-v$version" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT"
            echo "release_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - if: github.event_name == 'workflow_dispatch'
        run: pnpm install --frozen-lockfile

      - name: Commit SDK version and create tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm release:sdk "$VERSION" --yes --skip-checks

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm release:verify:sdk "${RELEASE_TAG}"

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify:sdk "${RELEASE_TAG}"
      - name: Publish SDK with provenance
        working-directory: packages/sdk
        run: |
          dist_tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then
            dist_tag=next
          fi
          npm publish --access public --provenance --tag "$dist_tag"
