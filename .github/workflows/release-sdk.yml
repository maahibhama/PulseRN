name: Release SDK

on:
  push:
    tags:
      - 'sdk-v[0-9]+.[0-9]+.[0-9]+'
      - 'sdk-v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: SDK release tag to create (for example sdk-v1.0.5)
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.14.0'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^sdk-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid SDK release tag: $RELEASE_TAG"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Verify package version and push tag
        run: |
          version="${RELEASE_TAG#sdk-v}"
          package_version="$(node -p "require('./packages/sdk/package.json').version")"
          if [[ "$version" != "$package_version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match SDK package version $package_version."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release tag already exists: $RELEASE_TAG"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "PulseRN SDK $version"
          git push origin "$RELEASE_TAG"

  verify:
    needs: prepare-tag
    if: always() && (github.event_name == 'push' || needs.prepare-tag.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm release:verify:sdk "${RELEASE_TAG}"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify:sdk "${RELEASE_TAG}"
      - name: Publish SDK with provenance
        working-directory: packages/sdk
        run: |
          dist_tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then
            dist_tag=next
          fi
          npm publish --access public --provenance --tag "$dist_tag"
