name: Release CLI

on:
  push:
    tags:
      - 'cli-v[0-9]+.[0-9]+.[0-9]+'
      - 'cli-v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: CLI release tag to create (for example, cli-v1.0.5)
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.14.0'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^cli-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid CLI release tag: $RELEASE_TAG"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Create and push release tag
        run: |
          version="${RELEASE_TAG#cli-v}"
          package_version="$(node -p "require('./packages/cli/package.json').version")"
          if [[ "$version" != "$package_version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match CLI package version $package_version."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release tag already exists: $RELEASE_TAG"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "PulseRN CLI $version"
          git push origin "$RELEASE_TAG"

  build:
    needs: prepare-tag
    if: always() && (github.event_name == 'push' || needs.prepare-tag.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^cli-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid CLI release tag: $RELEASE_TAG"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify tag matches CLI package version
        run: |
          version="${RELEASE_TAG#cli-v}"
          package_version="$(node -p "require('./packages/cli/package.json').version")"
          test "$version" = "$package_version" || {
            echo "::error::Tag $RELEASE_TAG does not match CLI package version $package_version."
            exit 1
          }
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm --filter @maahibhama/pulsern build
      - name: Pack release tarball and checksum
        run: |
          version="${RELEASE_TAG#cli-v}"
          mkdir -p release-cli
          pnpm --filter @maahibhama/pulsern pack --pack-destination release-cli
          mv "release-cli/maahibhama-pulsern-$version.tgz" "release-cli/pulsern-$version.tgz"
          test -f "release-cli/pulsern-$version.tgz"
          (
            cd release-cli
            sha256sum "pulsern-$version.tgz" > SHA256SUMS.txt
          )
      - name: Update Homebrew formula release metadata
        run: |
          version="${RELEASE_TAG#cli-v}"
          checksum="$(awk '{print $1}' release-cli/SHA256SUMS.txt)"
          sed -i -E \
            "s|releases/download/cli-v[^/]+/pulsern-[^\"]+\.tgz|releases/download/$RELEASE_TAG/pulsern-$version.tgz|" \
            Formula/pulsern-cli.rb
          sed -i -E \
            "s|^[[:space:]]*sha256 \"[a-f0-9]{64}\"|  sha256 \"$checksum\"|" \
            Formula/pulsern-cli.rb
          grep -F "releases/download/$RELEASE_TAG/pulsern-$version.tgz" Formula/pulsern-cli.rb
          grep -F "sha256 \"$checksum\"" Formula/pulsern-cli.rb
      - run: pnpm release:verify:cli "${RELEASE_TAG}"
      - name: Verify formula and standalone package
        run: |
          version="${RELEASE_TAG#cli-v}"
          tarball="$GITHUB_WORKSPACE/release-cli/pulsern-$version.tgz"
          expected="$(awk '{print $1}' release-cli/SHA256SUMS.txt)"
          formula="$(sed -n 's/^[[:space:]]*sha256 "\([a-f0-9]\{64\}\)"/\1/p' Formula/pulsern-cli.rb)"
          test "$expected" = "$formula"
          grep -F "releases/download/$RELEASE_TAG/pulsern-$version.tgz" Formula/pulsern-cli.rb
          prefix="$(mktemp -d)"
          npm install --omit=dev --prefix "$prefix" "$tarball"
          "$prefix/node_modules/.bin/pulsern" --version | grep -Fx "$version"
          "$prefix/node_modules/.bin/pulsern" --help | grep -F "PulseRN local web debugger"
          tar -tzf "$tarball" | grep -Fx "package/dist/server.js"
          tar -tzf "$tarball" | grep -Fx "package/dist/mcp-server.js"
          tar -tzf "$tarball" | grep -Fx "package/dist/public/index.html"
          if tar -xOf "$tarball" package/package.json | grep -q '"workspace:'; then
            echo "::error::Packed runtime metadata contains a workspace dependency."
            exit 1
          fi
      - name: Commit Homebrew formula release metadata
        run: |
          if git diff --quiet -- Formula/pulsern-cli.rb; then
            echo "Homebrew formula checksum is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pulsern-cli.rb
          git commit -m "chore(cli): update ${RELEASE_TAG} formula checksum"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pulsern-cli-${{ env.RELEASE_TAG }}
          path: |
            release-cli/pulsern-*.tgz
            release-cli/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pulsern-cli-${{ env.RELEASE_TAG }}
          path: release-cli
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@^11.5.1
      - name: Publish the verified tarball with provenance
        run: |
          version="${RELEASE_TAG#cli-v}"
          dist_tag=latest
          if [[ "$version" == *-* ]]; then
            dist_tag=next
          fi
          test -f "release-cli/pulsern-$version.tgz"
          npm publish "./release-cli/pulsern-$version.tgz" \
            --access public \
            --provenance \
            --tag "$dist_tag"

  publish-github:
    needs: [build, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pulsern-cli-${{ env.RELEASE_TAG }}
          path: release-cli
      - name: Create GitHub CLI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#cli-v}"
          prerelease=()
          if [[ "$version" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          cat > release-notes.md <<EOF
          ## PulseRN local web debugger $version

          Run without installing the Electron application:

          \`\`\`bash
          npx @maahibhama/pulsern@$version
          \`\`\`

          Homebrew:

          \`\`\`bash
          brew tap maahibhama/pulsern https://github.com/maahibhama/PulseRN
          brew install maahibhama/pulsern/pulsern-cli
          pulsern
          \`\`\`

          Contributors can build from source with \`pnpm dev:web\`.

          Node.js 22.5 or newer is required. Verify the attached npm tarball with
          \`SHA256SUMS.txt\`.
          EOF
          gh release create "$RELEASE_TAG" \
            "release-cli/pulsern-$version.tgz" \
            "release-cli/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PulseRN CLI $version" \
            --notes-file release-notes.md \
            "${prerelease[@]}"

  verify-published:
    needs: [build, publish-npm, publish-github]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pulsern-cli-${{ env.RELEASE_TAG }}
          path: release-cli
      - name: Compare workflow, npm, and GitHub artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#cli-v}"
          expected="$(sha256sum "release-cli/pulsern-$version.tgz" | awk '{print $1}')"

          npm_url=""
          for attempt in 1 2 3 4 5; do
            npm_url="$(npm view "@maahibhama/pulsern@$version" dist.tarball 2>/dev/null || true)"
            if [[ -n "$npm_url" ]]; then break; fi
            sleep $((attempt * 5))
          done
          test -n "$npm_url"
          curl --fail --location --retry 3 "$npm_url" --output npm-pulsern.tgz
          test "$(sha256sum npm-pulsern.tgz | awk '{print $1}')" = "$expected"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "pulsern-$version.tgz" \
            --dir github-release
          test "$(sha256sum "github-release/pulsern-$version.tgz" | awk '{print $1}')" = "$expected"

          grep -F "$expected  pulsern-$version.tgz" release-cli/SHA256SUMS.txt

  test-homebrew:
    needs: verify-published
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Audit and install the released formula
        run: |
          brew tap maahibhama/pulsern "$GITHUB_WORKSPACE"
          brew audit --strict --new maahibhama/pulsern/pulsern-cli
          brew install maahibhama/pulsern/pulsern-cli
          brew test maahibhama/pulsern/pulsern-cli
          pulsern --version | grep -Fx "${RELEASE_TAG#cli-v}"
          pulsern --help | grep -F "PulseRN local web debugger"
